name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Docs, index and secrets guardrails
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CHECK_BASE" ] && [ "$CHECK_BASE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-docs.mjs --base "$CHECK_BASE"
          else
            node scripts/check-docs.mjs
          fi
      - name: index.html script syntax
        run: node -e "const h=require('fs').readFileSync('index.html','utf8');[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].forEach(m=>new Function(m[1]));console.log('OK')"
      - name: Release tooling regression tests
        run: node --test scripts/test/*.test.mjs
      - name: Search index builds
        run: node scripts/index.mjs refresh > /dev/null
      - name: Public artifact builds
        run: node scripts/build-pages.mjs "$GITHUB_SHA"
      - name: Backend tests
        working-directory: worker
        run: |
          npm ci
          npx vitest run

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build public files with merged revision
        run: node scripts/build-pages.mjs "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify the live revision and API
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-production.mjs "$GITHUB_SHA"; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1
