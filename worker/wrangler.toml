name = "internmatch-api"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
PAXA_MODEL = "paxa-doc-extract-v1"
WEB_ORIGIN = "https://internmatch-api.entrace-space.workers.dev"
RICHMENU_MAIN = "richmenu-6be735e6bf02a3b801da8dc2b52d504f"

[[d1_databases]]
binding = "DB"
database_name = "internmatch"
database_id = "0d13249e-0371-4bdf-9a90-433f8010bc18"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]

[build]
command = "node ../scripts/build-pages.mjs"

[assets]
directory = "../.app"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
