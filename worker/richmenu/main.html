<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:2500px;height:1686px;overflow:hidden;font-family:"Sukhumvit Set","Thonburi",sans-serif;background:#eef1f8}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);width:2500px;height:1686px;gap:10px;box-sizing:border-box;padding:10px}
  .c{background:#fff;border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;color:#1f2a44}
  .c .i{font-size:200px;line-height:1}
  .c .t{font-size:92px;font-weight:700;text-align:center;line-height:1.15}
  .c .s{font-size:56px;color:#6b7591}
  .hero{background:#4f46e5;color:#fff}.hero .s{color:#dcdcff}
  .web{background:#e8f7ec}
</style></head><body>
<div class="grid">
  <div class="c hero"><div class="i">🏠</div><div class="t">วันนี้ต้องทำอะไร</div><div class="s">เริ่มตรงนี้</div></div>
  <div class="c"><div class="i">📸</div><div class="t">ส่งรูปให้อ่าน</div><div class="s">โพสต์งาน · เอกสาร</div></div>
  <div class="c"><div class="i">📋</div><div class="t">สถานะการสมัคร</div></div>
  <div class="c"><div class="i">🎓</div><div class="t">เช็กลิสต์คณะ</div></div>
  <div class="c"><div class="i">🔔</div><div class="t">การเตือนของฉัน</div></div>
  <div class="c web"><div class="i">🌐</div><div class="t">เปิดเว็บ</div><div class="s">ใช้ได้แม้ LINE ล่ม</div></div>
</div>
</body></html>
